<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outpost Radio — live lofi</title>
  <meta name="description" content="A lakeside radio for the late shift. Live lofi, ambient and synth streams in a glass receiver.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314101f'/%3E%3Cpath d='M32 12v40M20 24a17 17 0 0 0 0 16M44 24a17 17 0 0 1 0 16' stroke='%23ff9e64' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='32' cy='48' r='4' fill='%23ff9e64'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/lakeside-sunset.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="idle">
  <div class="scene" aria-hidden="true">
    <div class="scene__photo"></div>
    <div class="scene__wash"></div>
    <div class="scene__grain"></div>
  </div>

  <main class="stage">
    <header class="masthead">
      <span class="masthead__mark" aria-hidden="true"></span>
      <h1 class="masthead__title">Outpost Radio</h1>
      <p class="masthead__meta">Live lofi · ambient · synth</p>
    </header>

    <section class="poster" aria-label="Now playing">
      <p class="poster__status">
        <span class="led" aria-hidden="true"></span>
        <span id="status" data-status="idle" aria-live="polite">STANDBY</span>
      </p>
      <p class="poster__group" id="station-group">LOFI</p>
      <h2 class="poster__station" id="station-name" aria-live="polite">StreamAfrica Lofi</h2>
      <p class="poster__hint">
        <kbd>space</kbd> play
        <span class="poster__hint-sep">·</span>
        <kbd>←</kbd><kbd>→</kbd> tune
        <span class="poster__hint-sep">·</span>
        <kbd>m</kbd> mute
      </p>
    </section>

    <aside class="receiver glass" aria-label="Radio controls">
      <div class="receiver__row">
        <span class="receiver__label">Tuner</span>
        <span class="receiver__readout"><span id="station-number">01</span><span class="receiver__slash">/</span><span id="station-total">17</span></span>
      </div>

      <div class="tuner" aria-hidden="true">
        <div class="tuner__scale" id="tuner-scale"></div>
        <div class="tuner__needle" id="dial-needle"></div>
      </div>

      <div class="transport" role="group" aria-label="Playback">
        <button class="transport__btn" id="prev" type="button" aria-label="Previous station" title="Previous (←)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 5v14"/><path d="M19 5l-9 7 9 7z"/>
          </svg>
        </button>

        <button class="transport__play" id="play" type="button" aria-label="Play" title="Play / pause (space)">
          <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M9 5.5v13l10-6.5z"/>
          </svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" hidden>
            <rect x="7" y="5" width="3.6" height="14" rx="1.2"/>
            <rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/>
          </svg>
        </button>

        <button class="transport__btn" id="next" type="button" aria-label="Next station" title="Next (→)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 5v14"/><path d="M5 5l9 7-9 7z"/>
          </svg>
        </button>
      </div>

      <div class="volume">
        <div class="volume__head">
          <span class="receiver__label">Volume</span>
          <output class="volume__value" id="volume-value" for="volume">70%</output>
        </div>
        <div class="volume__row">
          <button class="volume__mute" id="mute" type="button" aria-label="Mute" title="Mute (m)">
            <svg id="icon-volume" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5z" fill="currentColor" stroke="none"/>
              <path d="M15.5 9a4 4 0 0 1 0 6"/>
              <path d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
            </svg>
            <svg id="icon-muted" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5z" fill="currentColor" stroke="none"/>
              <path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/>
            </svg>
          </button>
          <input class="slider" id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Volume">
        </div>
      </div>

      <div class="receiver__rule" aria-hidden="true"></div>

      <section class="stations" aria-label="Stations">
        <div class="stations__head">
          <span class="receiver__label">Stations</span>
          <span class="stations__note" id="stations-count">17 live</span>
        </div>
        <div class="stations__list" id="stations"></div>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="none" hidden></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
