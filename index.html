<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outpost Radio — live lofi</title>
  <meta name="description" content="A quiet little radio for the late shift. Live lofi, ambient and synth streams in a glass console.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312151b'/%3E%3Cpath d='M32 12v40M20 24a17 17 0 0 0 0 16M44 24a17 17 0 0 1 0 16' stroke='%23ff9e64' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='32' cy='48' r='4' fill='%23ff9e64'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="idle">
  <div class="scene" aria-hidden="true">
    <div class="scene__photo"></div>
    <div class="scene__haze"></div>
    <div class="scene__stars"></div>
    <svg class="scene__ridges" viewBox="0 0 1440 420" preserveAspectRatio="none">
      <path class="ridge ridge--far" d="M0,250 L90,214 L170,242 L250,196 L330,232 L420,180 L520,226 L610,192 L700,236 L790,200 L880,240 L980,206 L1080,244 L1170,210 L1260,246 L1350,208 L1440,240 L1440,420 L0,420 Z"/>
      <path class="ridge ridge--mid" d="M0,300 L120,262 L210,296 L320,250 L430,292 L540,258 L640,300 L760,266 L860,304 L980,270 L1090,306 L1200,276 L1310,310 L1440,280 L1440,420 L0,420 Z"/>
      <path class="ridge ridge--near" d="M0,352 L140,326 L260,354 L380,330 L500,360 L620,334 L740,362 L860,338 L980,364 L1100,340 L1220,366 L1340,344 L1440,368 L1440,420 L0,420 Z"/>
    </svg>
    <div class="scene__grain"></div>
    <div class="scene__vignette"></div>
  </div>

  <main class="shell">
    <div class="stack">
      <header class="brand">
        <h1 class="brand__title">OUTPOST<span class="brand__suffix">RADIO</span></h1>
        <p class="brand__note">late shift, again</p>
      </header>

      <section class="player glass" aria-label="Radio player">
        <div class="player__dial">
          <p class="player__group" id="station-group">LOFI</p>
          <h2 class="player__station" id="station-name" aria-live="polite">StreamAfrica Lofi</h2>
          <p class="player__status" id="status" data-status="idle">READY</p>
        </div>

        <div class="tuner" aria-hidden="true">
          <div class="tuner__track"></div>
          <div class="tuner__needle" id="dial-needle"></div>
        </div>

        <div class="player__controls">
          <button class="ctrl" id="prev" type="button" aria-label="Previous station" title="Previous (←)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 5v14"/><path d="M19 5l-9 7 9 7z"/>
            </svg>
          </button>

          <button class="ctrl ctrl--primary" id="play" type="button" aria-label="Play" title="Play / pause (space)">
            <svg id="icon-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
              <path d="M9 5.5v13l10-6.5z"/>
            </svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" hidden>
              <rect x="7" y="5" width="3.6" height="14" rx="1.2"/>
              <rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/>
            </svg>
          </button>

          <button class="ctrl" id="next" type="button" aria-label="Next station" title="Next (→)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 5v14"/><path d="M5 5l9 7-9 7z"/>
            </svg>
          </button>

          <div class="meter" id="meter" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="player__volume glass-soft">
          <button class="ctrl ctrl--ghost" id="mute" type="button" aria-label="Mute" title="Mute (m)">
            <svg id="icon-volume" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5z" fill="currentColor" stroke="none"/>
              <path d="M15.5 9a4 4 0 0 1 0 6"/>
              <path d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
            </svg>
            <svg id="icon-muted" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5z" fill="currentColor" stroke="none"/>
              <path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/>
            </svg>
          </button>
          <input class="slider" id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Volume">
          <output class="player__volume-value" id="volume-value" for="volume">70%</output>
        </div>
      </section>

      <nav class="stations glass" aria-label="Stations">
        <div class="stations__list" id="stations"></div>
      </nav>

      <p class="hint">
        <kbd>space</kbd> play <span class="hint__dot">·</span>
        <kbd>←</kbd><kbd>→</kbd> tune <span class="hint__dot">·</span>
        <kbd>m</kbd> mute
      </p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="none" hidden></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
